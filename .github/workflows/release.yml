name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scope to publishable packages and exclude apps (playground/www), which
      # invoke the `kallo` bin whose pnpm shim isn't present in CI — mirrors the
      # scoping already applied in ci.yml.
      - name: Type-check
        run: pnpm exec turbo run check-types --filter='!./apps/*'

      - name: Test
        run: pnpm exec turbo run test --filter='!./apps/*'

      - name: Build
        run: pnpm exec turbo run build --filter='!./apps/*'

      # Publishes packages/* whose version is not yet on npm; pnpm skips
      # already-published versions, so this is a no-op until a version is bumped.
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
